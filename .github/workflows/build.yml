name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up tools
        uses: jdx/mise-action@v5

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: mise run assemble

      - name: Run tests
        run: mise run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results

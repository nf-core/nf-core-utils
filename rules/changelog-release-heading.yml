# Keep a Changelog 1.1.0: https://keepachangelog.com/en/1.1.0/
id: changelog-release-heading
language: markdown
severity: error
message: "A release heading is `## [Unreleased]` or `## [X.Y.Z] - YYYY-MM-DD` (Keep a Changelog 1.1.0)."
files:
  - CHANGELOG.md
rule:
  kind: atx_heading
  has:
    kind: atx_h2_marker
  not:
    has:
      field: heading_content
      regex: '^(\[Unreleased\]|\[\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?\] - \d{4}-\d{2}-\d{2}( \[YANKED\])?)$'

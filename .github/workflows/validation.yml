name: Plugin Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NFT_DIFF: pdiff
  NFT_DIFF_ARGS: "--line-numbers --expand-tabs=2"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up tools
        uses: jdx/mise-action@v5

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v5

      - name: Install snapshot diff formatter
        run: python -m pip install pdiff

      - name: Conda setup
        uses: conda-incubator/setup-miniconda@505e6394dae86d6a5c7fbb6e3fb8938e3e863830 # v3
        with:
          auto-update-conda: true
          channels: conda-forge, bioconda
          channel-priority: strict
          conda-remove-defaults: true

      - name: Clean workspace
        run: mise run clean

      - name: Set NFT_WORKDIR dynamically
        run: echo "NFT_WORKDIR=$HOME" >> $GITHUB_ENV

      - name: Build and validate plugin
        run: mise run validate

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            validation/*/work/pipeline_info/
            validation/*/work/*.log
            validation/*/work/.nextflow.log
            validation/.nf-test/reports/
            validation/**/*.nf.test.snap
          retention-days: 7

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            validation/*/.nextflow.log
            validation/*/work/**/*.log
            validation/.nf-test/**/*.log
          retention-days: 7

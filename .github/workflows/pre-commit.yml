name: prek

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: mise install
        env:
          MISE_LOCKED: "1"
      - run: mise doctor project
      - uses: j178/prek-action@v2

# Single-root Gradle plugin: mise's Gradle provider only activates on literal
# `include` directives in settings.gradle, so declare gradle:: explicitly.
# See https://mise.jdx.dev/tasks/workspace-graph.html#gradle-workspaces
monorepo_root = true

[monorepo]
config_roots = ["."]

[monorepo.projects."gradle::"]
root = "."

[tools]
java = "temurin-21"
"github:nextflow-io/nextflow" = { version = "26.10.2", asset_pattern = "nextflow", bin = "nextflow" }
"github:askimed/nf-test" = "0.9.3"

[tasks.assemble]
description = "Build the plugin"
run = "./gradlew assemble"

[tasks.clean]
description = "Remove build and Nextflow run artifacts"
run = """
rm -rf .nextflow* work build
rm -rf validation/.nextflow* validation/work validation/results
rm -rf validation/trace.txt validation/timeline.html validation/report.html
./gradlew clean
"""

[tasks.test]
description = "Run plugin unit tests"
run = "./gradlew test"

[tasks.install]
description = "Install the plugin into the local Nextflow plugins directory"
run = "./gradlew install"

[tasks.release]
description = "Publish the plugin (requires registry credentials)"
run = "./gradlew releasePlugin"

[tasks.validate]
description = "Install the plugin and run end-to-end validation"
depends = [":install"]
dir = "{{ config_root }}/validation"
run = """
bash config-validation/startup-checks.sh
nf-test test --verbose
"""

[tasks.update-snapshots]
description = "Install the plugin and regenerate validation snapshots"
depends = [":install"]
dir = "{{ config_root }}/validation"
run = "nf-test test --verbose --update-snapshot --clean-snapshot"
